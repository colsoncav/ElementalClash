'use strict';
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=960,H=560;C.width=W;C.height=H;
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=W*s+'px';C.style.height=H*s+'px';}
resize();addEventListener('resize',resize);

// INPUT
const keys={};let rawCap=null;
let rawGamepadCap=null;
let lastPadButtons=[];
document.addEventListener('keydown',e=>{
  _boot();_startBgm();
  if(rawCap){e.preventDefault();rawCap(e.code);return;}
  keys[e.code]=true;
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
let mx=0,my=0,mclk=false;
function cxy(ex,ey){const r=C.getBoundingClientRect();return[(ex-r.left)*(W/r.width),(ey-r.top)*(H/r.height)];}
C.addEventListener('mousemove',e=>{[mx,my]=cxy(e.clientX,e.clientY);});
C.addEventListener('click',e=>{_boot();_startBgm();[mx,my]=cxy(e.clientX,e.clientY);mclk=true;});
C.addEventListener('touchstart',e=>{e.preventDefault();_boot();_startBgm();const t=e.touches[0];[mx,my]=cxy(t.clientX,t.clientY);mclk=true;},{passive:false});
function inbox(bx,by,bw,bh){return mx>=bx&&mx<=bx+bw&&my>=by&&my<=by+bh;}

function _gamepads(){
  if(!navigator.getGamepads)return [];
  return Array.from(navigator.getGamepads()).filter(Boolean);
}

function _scanGamepadPress(){
  const pads=_gamepads();
  for(const pad of pads){
    const prev=lastPadButtons[pad.index]||[];
    for(let i=0;i<pad.buttons.length;i++){
      const pressed=!!pad.buttons[i].pressed;
      if(pressed&&!prev[i]){
        lastPadButtons[pad.index]=pad.buttons.map(b=>!!b.pressed);
        return {pad,button:i};
      }
    }
    lastPadButtons[pad.index]=pad.buttons.map(b=>!!b.pressed);
  }
  return null;
}

function _firstGamepad(){
  return _gamepads()[0]||null;
}

function _isGpBinding(code){return typeof code==='string'&&code.startsWith('GP:');}
function _gpCode(buttonIndex){return `GP:${buttonIndex}`;}
function _controlPressed(bind){
  if(!bind)return false;
  if(_isGpBinding(bind)){
    const idx=parseInt(bind.slice(3),10);
    return _gamepads().some(p=>!!p.buttons[idx]?.pressed);
  }
  return !!keys[bind];
}

function _controllerStick(){
  const pad=_firstGamepad();
  if(!pad)return {x:0,y:0};
  return {x:pad.axes?.[0]||0,y:pad.axes?.[1]||0};
}

// AUDIO
// ── AUDIO ENGINE ──────────────────────────────────────────────────────────
let AC = null;

function _boot() {
  // Create context on first call, resume synchronously if suspended
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state !== 'running') AC.resume();
}

function _tone(type, f0, f1, dur, vol) {
  try {
    _boot();
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur * 0.85);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  } catch(e) {}
}

function _noise(dur, vol, lo, hi) {
  try {
    _boot();
    const t = AC.currentTime;
    const sr = AC.sampleRate, len = Math.ceil(sr * dur);
    const buf = AC.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf;
    const bpf = AC.createBiquadFilter(); bpf.type = 'bandpass';
    bpf.frequency.value = (lo + hi) / 2; bpf.Q.value = 0.8;
    const g = AC.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(bpf); bpf.connect(g); g.connect(AC.destination);
    src.start(t); src.stop(t + dur + 0.05);
  } catch(e) {}
}

// ORIGINAL BACKGROUND MUSIC (energetic obstacle-course vibe)
const BGM={started:false,step:0,timer:null,bpm:148,gain:null};
const BGM_ROOTS=[60,65,67,62];
const BGM_LEAD_A=[12,14,16,19,16,14,12,null,11,12,14,16,14,12,11,null];
const BGM_LEAD_B=[16,null,19,21,19,16,14,12,11,null,12,14,16,14,12,11];

function _midiToHz(m){return 440*Math.pow(2,(m-69)/12);}

function _bgGain(){
  if(!AC)return null;
  if(!BGM.gain){
    BGM.gain=AC.createGain();
    // Requested: make music much louder.
    BGM.gain.gain.value=0.88;
    BGM.gain.connect(AC.destination);
  }
  return BGM.gain;
}

function _bgTone(type,midi,dur,vol,at){
  try{
    if(!AC||AC.state!=='running')return;
    const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
    o.type=type;
    o.frequency.setValueAtTime(_midiToHz(midi),at);
    f.type='lowpass';
    f.frequency.value=type==='square'?2400:1800;
    g.gain.setValueAtTime(vol,at);
    g.gain.exponentialRampToValueAtTime(0.001,at+dur);
    o.connect(f);f.connect(g);g.connect(_bgGain());
    o.start(at);o.stop(at+dur+.02);
  }catch(e){}
}

function _bgNoise(dur,vol,lo,hi,at){
  try{
    if(!AC||AC.state!=='running')return;
    const len=Math.max(1,Math.ceil(AC.sampleRate*dur));
    const buf=AC.createBuffer(1,len,AC.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=buf;
    const bpf=AC.createBiquadFilter();bpf.type='bandpass';bpf.frequency.value=(lo+hi)/2;bpf.Q.value=1;
    const g=AC.createGain();
    g.gain.setValueAtTime(vol,at);
    g.gain.exponentialRampToValueAtTime(0.001,at+dur);
    src.connect(bpf);bpf.connect(g);g.connect(_bgGain());
    src.start(at);src.stop(at+dur+.02);
  }catch(e){}
}

function _tickBgm(){
  if(!AC||AC.state!=='running')return;
  const step=BGM.step%16;
  const bar=(BGM.step>>4)%BGM_ROOTS.length;
  const phrase=(BGM.step>>5)%2;
  const root=BGM_ROOTS[bar];
  const swing=(step%2)?0.01:0;
  const t=AC.currentTime+.03+swing;

  if(step%2===0)_bgTone('triangle',root-24,.22,.13,t);
  if(step%4===2)_bgTone('triangle',root-12,.12,.08,t+.005);

  if(step===0||step===3||step===6||step===8||step===10||step===14){
    _bgTone('sine',36,.085,.10,t);
    _bgNoise(.035,.035,40,190,t);
  }
  if(step===4||step===12){
    _bgNoise(.11,.06,1500,7800,t);
    _bgTone('triangle',50,.06,.035,t);
  }
  if(step%2===1)_bgNoise(.03,.02,6200,11200,t);
  if(step===2||step===6||step===10||step===14)_bgNoise(.04,.014,2200,5200,t);

  if(step===0||step===4||step===8||step===12){
    _bgTone('sawtooth',root,.17,.032,t);
    _bgTone('sawtooth',root+4,.18,.028,t+.008);
    _bgTone('sawtooth',root+7,.20,.026,t+.012);
  }

  const off=(phrase===0?BGM_LEAD_A:BGM_LEAD_B)[step];
  if(off!==null){
    const note=root+off;
    _bgTone('square',note,.13,.065,t);
    _bgTone('triangle',note+12,.09,.028,t+.05);
  }
  BGM.step++;
}

function _startBgm(){
  try{
    _boot();
    if(!AC||AC.state!=='running')return;
    _bgGain();
    if(BGM.started){
      if(!BGM.timer){
        const stepMs=(60/BGM.bpm/4)*1000;
        BGM.timer=setInterval(_tickBgm,stepMs);
      }
      return;
    }
    BGM.started=true;
    const stepMs=(60/BGM.bpm/4)*1000; // 16th-note scheduler
    BGM.timer=setInterval(_tickBgm,stepMs);
  }catch(e){}
}

function _setBgmPaused(paused){
  try{
    if(!BGM.started)return;
    if(paused){
      if(BGM.timer){clearInterval(BGM.timer);BGM.timer=null;}
    }else{
      _boot();
      if(AC&&AC.state==='running'&&!BGM.timer){
        const stepMs=(60/BGM.bpm/4)*1000;
        BGM.timer=setInterval(_tickBgm,stepMs);
      }
    }
  }catch(e){}
}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
let gf=0,titleF=0;

// PARTICLES
let parts=[];
function emit(x,y,n,o={}){
  for(let i=0;i<n;i++){
    const a=o.ang!==undefined?o.ang+rnd(-.5,.5):rnd(0,Math.PI*2);
    const sp=(o.spd||3)*rnd(.3,1.6);
    parts.push({x,y,vx:Math.cos(a)*sp+(o.dvx||0),vy:Math.sin(a)*sp-(o.up||0),
      life:1,dec:rnd(.02,.055),sz:o.sz||rnd(2,5),
      col:Array.isArray(o.col)?o.col[0|rnd(0,o.col.length)]:(o.col||'#fff'),
      grav:o.grav!==undefined?o.grav:.13,glow:o.glow||false});
  }
}
function tickParts(){parts=parts.filter(p=>p.life>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=.97;p.life-=p.dec;p.sz*=.97;});}
function drawParts(){parts.forEach(p=>{ctx.globalAlpha=p.life*p.life;if(p.glow){ctx.shadowBlur=9;ctx.shadowColor=p.col;}ctx.fillStyle=p.col;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);ctx.shadowBlur=0;});ctx.globalAlpha=1;}

// ══════════════════════════════════
// TOURNAMENT STATE
// ══════════════════════════════════
let tourney=null; // null when not in tourney mode
// tourney = {
//   round: 1..5,  difficulty: 1..5
//   playerElem, cpuElem,
//   playerBinds,
//   usedPlayerElems:[],  usedCPUElems:[],
//   wins: 0, lastResult: 'win'|'lose'
// }
let comicF=0; // frame counter for comic screen

let setup={numP:2,curP:0,elems:[],binds:[],bindSlot:0,bindErr:'',bindErrT:0,teamMode:false,teams:[],bindDevice:'keyboard',bindDevices:[]};
let gamePaused=false,pauseKeyLatch=false;
// TEAM COLOURS  (team 0 = red/orange, team 1 = blue/cyan)
const TEAM_COLS=['#ff4444','#4488ff'];
const TEAM_NAMES=['RED TEAM','BLUE TEAM'];
const TEAM_GLOWS=['#ff8800','#00aaff'];
let players=[],bullets=[],supers=[];
let waveWall=null;
let cyclone=null;

// ══════════════════════════════════
// BULLET CLASS
// ══════════════════════════════════
class Bullet{
  constructor(owner,x,y,vx,vy,opts={}){
    this.ownIdx=owner.idx;this.elemId=owner.elemId;
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    const el=owner.el;
    this.dmg=opts.dmg??el.bdmg;
    this.r=opts.r??el.bsz;
    this.col=opts.col??el.col;
    this.glow=opts.glow??el.glow;
    this.effect=opts.effect??el.beffect;
    this.life=opts.life??100;
    this.grav=this.elemId==='earth'?.09:0;
    this.owner=owner;
  }
  get dead(){return this.life<=0||this.x<-60||this.x>W+60||this.y>PLATS[0].y+20||this.y<-80;}
  update(){
    this.x+=this.vx;this.y+=this.vy;this.vy+=this.grav;this.life--;
    if(gf%3===0)emit(this.x,this.y,1,{col:this.col,sz:this.r*.6,spd:.5,grav:0,dec:.12,glow:true});
  }
  draw(){
    ctx.save();ctx.shadowBlur=20;ctx.shadowColor=this.glow;
    ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(this.x,this.y,this.r*.38,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.restore();
  }
}

// ══════════════════════════════════
// PLAYER CLASS
// ══════════════════════════════════
class Player{
  constructor(idx,elemId,binds){
    this.idx=idx;this.elemId=elemId;this.el=ELEMS[elemId];this.binds=binds;
    const sx=SPWN[setup.numP];
    this.x=(sx[idx]||W/2)-15;this.y=PLATS[0].y-50;
    this.w=30;this.h=46;this.vx=0;this.vy=0;
    this.onGround=false;this.jumps=2;
    this.facing=idx<setup.numP/2?1:-1;
    this.hp=100;this.maxHp=100;this.lives=3;
    this.dead=false;this.elim=false;this.respTimer=0;this.iframes=0;
    this.shootCd=0;this.chargeTick=0;this.chargePrev=false;this.superReady=false;
    this.frozen=0;this.burned=0;this.burnTick=0;this.stunned=0;this.soaked=0;
    this.prevJ=false;this.walkF=0;this.hitFlash=0;this.deathAnim=0;
    this.isCPU=false;this.ai={}; // {left,right,jump,attack} booleans for CPU
  }
  get cx(){return this.x+this.w/2;}get cy(){return this.y+this.h/2;}
  get right(){return this.x+this.w;}get bottom(){return this.y+this.h;}

  applyHit(dmg,src,effect){
    if(this.iframes>0||this.dead||this.elim)return false;
    if(setup&&setup.teamMode&&Array.isArray(setup.teams)&&src&&src.idx!==undefined&&setup.teams[this.idx]!==undefined&&setup.teams[src.idx]!==undefined&&setup.teams[this.idx]===setup.teams[src.idx])return false;
    // If a player is charging when hit, force their charge to restart.
    if(this.chargeTick>0||this.superReady){this.chargeTick=0;this.superReady=false;this.chargePrev=false;}
    this.hp-=dmg;this.iframes=20;this.hitFlash=12;
    emit(this.cx,this.cy,10,{col:[src.el.col,'#fff'],spd:5,glow:true});
    sfx('hit',src.elemId);
    const dir=this.cx>src.cx?1:-1;
    if(effect==='burn'){this.burned=Math.max(this.burned,180);}
    if(effect==='knockback'){this.vx=dir*12;this.vy=-5.5;this.soaked=90;sfx('knockback');}
    if(effect==='chain'){
      players.forEach(p=>{
        if(p===this||p===src||p.dead)return;
        if(setup&&setup.teamMode&&Array.isArray(setup.teams)&&src&&src.idx!==undefined&&setup.teams[p.idx]!==undefined&&setup.teams[p.idx]===setup.teams[src.idx])return;
        if(Math.random()<0.5){
          p.applyHit(Math.ceil(dmg*.5),src,null);
          emit(p.cx,p.cy,7,{col:['#ffff00','#fff'],spd:4,glow:true});
          sfx('chain');
        }
      });
    }
    if(effect==='stun'){this.stunned=35;sfx('stun');}
    if(effect==='push'){this.vx=dir*10;}
    if(effect==='lifesteal'&&src&&!src.dead){src.hp=Math.min(src.maxHp,src.hp+3);}
    if(this.frozen>0)sfx('freeze');
    if(this.hp<=0)this.die();
    return true;
  }

  die(){
    this.lives--;this.hp=0;this.deathAnim=60;
    emit(this.cx,this.cy,36,{col:[this.el.col,this.el.glow,'#fff'],spd:8,glow:true,up:2});
    sfx('ko');
    if(this.lives<=0){this.elim=true;this.dead=true;}
    else{this.dead=true;this.respTimer=180;}
  }
  respawn(){
    const sx=SPWN[setup.numP];
    this.x=(sx[this.idx]||W/2)-15;this.y=-60;
    this.vx=0;this.vy=0;this.hp=100;this.dead=false;
    this.frozen=0;this.burned=0;this.stunned=0;this.soaked=0;this.iframes=180;
    emit(this.cx,this.cy,20,{col:[this.el.col,'#fff'],spd:5,glow:true});
  }

  shoot(){
    const el=this.el;
    const bx=this.cx+this.facing*(this.w/2+10),by=this.cy-4;
    if(el.triple){
      [-.28,0,.28].forEach(sp=>{
        bullets.push(new Bullet(this,bx,by,el.bspd*this.facing,sp*el.bspd*.22));
      });
    }else{
      bullets.push(new Bullet(this,bx,by,el.bspd*this.facing,0));
    }
    sfx('shoot',this.elemId);
    emit(bx,by,5,{col:[el.col,el.glow],spd:2.5,ang:this.facing>0?0:Math.PI,glow:true,dec:.13});
  }

  fireSuper(){
    sfx('super',this.elemId);
    emit(this.cx,this.cy,32,{col:[this.el.col,this.el.glow,'#fff'],spd:9,glow:true,up:1});
    supers.push(new SuperAtk(this));
  }

  update(){
    if(this.dead){
      if(!this.elim){this.respTimer--;if(this.respTimer<=0)this.respawn();}
      if(this.deathAnim>0)this.deathAnim--;
      return;
    }
    if(this.iframes>0)this.iframes--;
    if(this.frozen>0){this.frozen--;return;}
    if(this.stunned>0){this.stunned--;}
    if(this.soaked>0)this.soaked--;
    if(this.burned>0){
      this.burned--;this.burnTick++;
      if(this.burnTick%28===0){
        this.hp-=2;emit(this.cx,this.y+4,3,{col:['#ff4400','#ff8800'],spd:2,up:2.5,grav:-.04});
        sfx('burn');
        if(this.hp<=0)this.die();
      }
    }
    if(this.hitFlash>0)this.hitFlash--;

    const b=this.binds;
    if(this.isCPU)this.updateCPU();
    const isRemote = (typeof netState !== 'undefined') && netState.isOnline && (this.idx !== netState.myPlayerIdx);
    const ri = this.remoteInput || {};
    const stick=(!this.isCPU&&!isRemote&&setup.bindDevices[this.idx]==='controller')?_controllerStick():{x:0,y:0};
    const L=this.isCPU?this.ai.left:(isRemote?!!ri.left:(_controlPressed(b.left)||(stick.x<-0.35)));
    const R=this.isCPU?this.ai.right:(isRemote?!!ri.right:(_controlPressed(b.right)||(stick.x>0.35)));
    const J=this.isCPU?this.ai.jump:(isRemote?!!ri.jump:(_controlPressed(b.jump)||(stick.y<-0.35)));
    const A=this.isCPU?this.ai.attack:(isRemote?!!ri.attack:_controlPressed(b.attack));
    const mspd=this.soaked>0?2.5:4;

    if(!this.stunned){
      if(L&&!R){this.vx=Math.max(this.vx-2,-mspd);this.facing=-1;}
      else if(R&&!L){this.vx=Math.min(this.vx+2,mspd);this.facing=1;}
      else{this.vx*=this.onGround?.6:.9;if(Math.abs(this.vx)<.1)this.vx=0;}
    } else {this.vx*=.85;}

    // jump on press edge
    if(J&&!this.prevJ&&this.jumps>0&&!this.stunned){
      this.vy=this.jumps===2?-13.5:-11.5;
      this.jumps--;this.onGround=false;
      sfx('jump');emit(this.cx,this.bottom,7,{col:[this.el.col],spd:2.5,up:.8,grav:.04});
    }
    this.prevJ=J;

    // attack / charge — only shoot when NOT charging (chargeTick < 4 means just tapped)
    if(A&&!this.stunned){
      this.chargeTick++;
      if(this.chargeTick===180){sfx('charge');this.superReady=true;}
      // Only fire bullets when not holding long enough to be "charging"
      if(this.chargeTick<4&&this.shootCd<=0){this.shoot();this.shootCd=this.el.bfr;}
    } else if(!A&&this.chargePrev){
      if(this.superReady||this.chargeTick>=176)this.fireSuper();
      this.chargeTick=0;this.superReady=false;
    }
    this.chargePrev=A;
    if(this.shootCd>0)this.shootCd--;

    // physics
    this.vy=Math.min(this.vy+0.62,16);
    this.x+=this.vx;this.y+=this.vy;

    // platform collision
    this.onGround=false;
    PLATS.forEach(pl=>{
      if(this.right>pl.x+5&&this.x<pl.x+pl.w-5&&this.vy>=0){
        const pb=this.y+this.h-this.vy;
        if(pb<=pl.y+8&&this.bottom>=pl.y){this.y=pl.y-this.h;this.vy=0;this.onGround=true;this.jumps=2;}
      }
      if(pl.main){
        if(this.x<pl.x+2){this.x=pl.x+2;this.vx=0;}
        if(this.right>pl.x+pl.w-2){this.x=pl.x+pl.w-2-this.w;this.vx=0;}
        if(this.y<-100){this.y=-100;this.vy=0;}
      }
    });
    if(this.y>H+80)this.die();
    if(this.onGround&&Math.abs(this.vx)>.3)this.walkF+=.2;
    // ambient particles
    if(gf%8===this.idx%8)emit(this.cx+rnd(-7,7),this.y+rnd(0,this.h),1,{col:this.el.pcols,spd:.8,up:1.2,grav:-.03,sz:2.5,dec:.05});
  }


  updateCPU(){
    const diff=tourney?tourney.difficulty:3;
    const target=players.find(p=>p!==this&&!p.dead&&!p.elim);
    if(!target){this.ai={left:false,right:false,jump:false,attack:false};return;}
    const ai=this.ai;
    const dx=target.cx-this.cx, dy=target.cy-this.cy;
    const dist=Math.hypot(dx,dy);

    // ── ALWAYS face target — no hesitation ─────────────────────────
    this.facing=dx>0?1:-1;

    // ── REACTION FILTER — higher diff = reacts every frame ─────────
    // diff1=react 30% of frames, diff5=react 100%
    const reactRate=[0,.30,.50,.70,.88,1.0][diff];
    if(Math.random()>reactRate) return; // skip AI this frame (simulates reaction time)

    // ── BULLET DODGE — checks ALL incoming projectiles ──────────────
    // Detection radius grows with diff; dodge probability near-100% at diff5
    const detectR=[0,110,160,210,270,999][diff];
    const dodgeJumpProb=[0,.10,.30,.55,.80,.97][diff];
    const dodgeSideProb=[0,.30,.55,.75,.90,.99][diff];
    let dodging=false;

    bullets.forEach(bl=>{
      if(bl.ownIdx===this.idx) return;
      const bdx=bl.x-this.cx, bdy=bl.y-this.cy;
      const d2=Math.hypot(bdx,bdy);
      if(d2>detectR) return;
      // Is bullet heading toward us?
      const towardX=(bl.vx!==0)&&(Math.sign(bl.vx)===Math.sign(bdx));
      const towardY=(Math.abs(bl.vy)>Math.abs(bl.vx))&&(Math.sign(bl.vy)===Math.sign(bdy));
      if(!towardX&&!towardY) return;

      dodging=true;
      // Prefer jump-dodge to stay mobile
      if(this.onGround&&this.jumps>0&&Math.random()<dodgeJumpProb){
        ai.jump=true;
        setTimeout(()=>{if(this.ai)this.ai.jump=false;}, 85+Math.random()*30);
      } else if(Math.random()<dodgeSideProb){
        // Dash away from bullet trajectory
        ai.left = bl.vx>0;
        ai.right= bl.vx<0;
      }
      // At diff4-5, also double-jump-dodge mid-air
      if(diff>=4&&!this.onGround&&this.jumps>0&&Math.random()<.55){
        ai.jump=true;
        setTimeout(()=>{if(this.ai)this.ai.jump=false;},70);
      }
    });

    // ── MOVEMENT ────────────────────────────────────────────────────
    // Engagement zone: diff1=keep far, diff5=get RIGHT in their face
    const ideal=[0,210,170,130,85,40][diff];

    if(!dodging){
      if(Math.abs(dx)>ideal+20){
        // Chase
        ai.right=dx>0; ai.left=dx<0;
      } else if(Math.abs(dx)<ideal-20){
        // Back up to ideal range
        ai.right=dx<0; ai.left=dx>0;
      } else {
        // In sweet spot — constant strafing prevents the player from predicting
        // Higher diff = faster/more erratic strafe
        const phase=gf*[0,.05,.08,.11,.15,.20][diff]+this.idx*1.7;
        const strafe=Math.sin(phase)>0;
        ai.left=strafe; ai.right=!strafe;
      }
    }

    // ── PLATFORM NAVIGATION ──────────────────────────────────────────
    // Jump when target is above us
    if(dy<-60&&this.onGround){
      const prob=[0,.04,.08,.14,.24,.40][diff];
      if(Math.random()<prob){
        ai.jump=true;
        setTimeout(()=>{if(this.ai)this.ai.jump=false;}, 80);
      }
    }
    // Aggressive random jumps to stay in air and dodge (very hard at d4-5)
    if(this.onGround&&Math.random()<[0,.005,.012,.022,.040,.065][diff]){
      ai.jump=true;
      setTimeout(()=>{if(this.ai)this.ai.jump=false;}, 75+Math.random()*40);
    }
    // Mid-air double jump to reach elevated target
    if(!this.onGround&&this.jumps>0&&dy<-90&&Math.random()<[0,.015,.03,.06,.12,.22][diff]){
      ai.jump=true;
      setTimeout(()=>{if(this.ai)this.ai.jump=false;}, 60);
    }
    // Clear stale jump flag
    if(ai.jump&&!this.onGround&&this.jumps<=0) ai.jump=false;

    // ── COMBAT: SHOOT & SUPER CHARGE ────────────────────────────────
    const facingTgt=(dx>0&&this.facing>0)||(dx<0&&this.facing<0);
    // Fire as fast as cooldown allows; higher diff doesn't waste a single opening
    // shootEvery = minimum gap between shot decisions
    const shootEvery=[0,22,12,6,3,1][diff];

    if(facingTgt&&this.shootCd<=0&&!this.chargeTick&&gf%shootEvery===0){
      // Decide: charge super or fire normal?
      // Super charge probability per decision window — gets scary at d4-5
      const superProb=[0,.02,.05,.12,.25,.45][diff];
      if(Math.random()<superProb){
        // Hold attack for a full super charge duration then release
        ai.attack=true;
        const holdMs=(185+Math.random()*25)*(1000/60);
        setTimeout(()=>{if(this.ai) this.ai.attack=false;}, holdMs);
      } else {
        // Snap-fire normal shot
        ai.attack=true;
        // Tap duration — shorter at higher diff (snappier trigger)
        const tapMs=[0,80,60,45,30,20][diff];
        setTimeout(()=>{if(this.ai) this.ai.attack=false;}, tapMs);
      }
    }
    // Release super the INSTANT it's ready — never wastes charge
    if(this.superReady) ai.attack=false;

    // ── PANIC MODE when low HP ───────────────────────────────────────
    // d4-5 AI goes berserk when below 35 HP: rushes in, fires constantly
    if(diff>=4&&this.hp<35&&this.hp>0){
      const panicRate=[0,0,0,0,.07,.13][diff];
      if(Math.random()<panicRate){
        // Rush toward target
        ai.right=dx>0; ai.left=dx<0;
        // Fire non-stop
        if(this.shootCd<=0&&!this.chargeTick){
          ai.attack=true;
          setTimeout(()=>{if(this.ai)this.ai.attack=false;},25);
        }
      }
    }

    // ── COUNTER-ATTACK: punish player who is reloading ───────────────
    // At d5: if target's last shot was very recent, hold ground and prepare super
    if(diff===5&&target.shootCd>10&&!this.chargeTick&&Math.random()<.04){
      ai.attack=true; // begin charging while target can't shoot back
      const holdMs=200*(1000/60);
      setTimeout(()=>{if(this.ai)this.ai.attack=false;},holdMs);
    }
  }

  draw(){
    if(this.elim)return;
    const el=this.el;
    if(this.dead&&!this.elim){
      const t=Math.ceil(this.respTimer/60);
      ctx.globalAlpha=.28+.14*Math.sin(gf*.12);
      ctx.font='bold 12px "Orbitron"';ctx.textAlign='center';ctx.fillStyle=el.col;
      ctx.fillText(`P${this.idx+1}  ${t}s`,SPWN[setup.numP][this.idx],PLATS[0].y-65);
      ctx.textAlign='left';ctx.globalAlpha=1;return;
    }
    if(this.dead)return;
    if(this.iframes>120&&Math.floor(gf/4)%2===0)return;
    const flash=this.hitFlash>0&&Math.floor(this.hitFlash/2)%2===0;
    const frozen=this.frozen>0;
    const wk=Math.sin(this.walkF)*(this.onGround&&Math.abs(this.vx)>.3?1:0);
    ctx.save();ctx.translate(this.cx,this.cy);if(this.facing===-1)ctx.scale(-1,1);

    // charge arc
    if(this.chargeTick>30){
      const cp=Math.min(this.chargeTick/180,1);
      const blink=this.superReady&&Math.sin(gf*.25)>0;
      ctx.strokeStyle=blink?'#ffffff':el.glow;ctx.lineWidth=2.5;
      ctx.shadowBlur=16;ctx.shadowColor=el.glow;ctx.globalAlpha=.9;
      ctx.beginPath();ctx.arc(0,0,this.w+5,-Math.PI/2,-Math.PI/2+Math.PI*2*cp);ctx.stroke();
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
    if(flash){ctx.shadowBlur=24;ctx.shadowColor='#fff';}

    // legs
    const lc=flash?'#fff':el.dark;
    ctx.fillStyle=lc;
    ctx.fillRect(-this.w/2+2,this.h/4+(wk*.8|0),this.w/2-2,this.h/4+4);
    ctx.fillRect(2,this.h/4-(wk*.8|0),this.w/2-2,this.h/4+4);

    // body
    const bg=ctx.createLinearGradient(-this.w/2,-this.h/4,this.w/2,this.h/4);
    bg.addColorStop(0,flash?'#fff':el.col);bg.addColorStop(1,flash?'#fff':el.dark);
    ctx.shadowBlur=10;ctx.shadowColor=el.glow;
    ctx.fillStyle=bg;ctx.fillRect(-this.w/2,-this.h/4,this.w,this.h/2);ctx.shadowBlur=0;

    // arm
    ctx.fillStyle=flash?'#fff':el.col;
    ctx.fillRect(this.w/2-3,-this.h/8,(this.chargePrev?this.w/3+9:this.w/3),this.h/5);

    // core
    const cp2=.7+.3*Math.sin(gf*.1+this.idx);
    ctx.shadowBlur=14;ctx.shadowColor=el.glow;
    ctx.fillStyle=el.glow;ctx.beginPath();ctx.arc(0,0,5.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,2.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;

    // head
    ctx.shadowBlur=8;ctx.shadowColor=el.glow;
    ctx.fillStyle=flash?'#fff':el.col;ctx.fillRect(-this.w/2+2,-this.h/2,this.w-4,this.h/3+2);ctx.shadowBlur=0;

    // visor
    const ep=.75+.25*Math.sin(gf*.13+this.idx);
    ctx.shadowBlur=12;ctx.shadowColor=el.glow;
    // parse hex to rgba string manually
    ctx.fillStyle=flash?'#fff':el.glow;ctx.globalAlpha=ep;
    ctx.fillRect(-this.w/2+5,-this.h/2+5,this.w-10,7);ctx.globalAlpha=1;ctx.shadowBlur=0;

    // frozen overlay
    if(frozen){
      ctx.fillStyle='rgba(180,220,255,.38)';ctx.fillRect(-this.w/2-3,-this.h/2-3,this.w+6,this.h+6);
      ctx.strokeStyle='rgba(200,240,255,.65)';ctx.lineWidth=2;ctx.shadowBlur=12;ctx.shadowColor='#aaddff';
      ctx.strokeRect(-this.w/2-3,-this.h/2-3,this.w+6,this.h+6);ctx.shadowBlur=0;
    }
    // Team stripe
    if(setup.teamMode&&setup.teams[this.idx]!==undefined){
      const tc=TEAM_COLS[setup.teams[this.idx]];
      ctx.shadowBlur=8;ctx.shadowColor=tc;
      ctx.fillStyle=tc;ctx.fillRect(-this.w/2,this.h/2+2,this.w,4);
      ctx.shadowBlur=0;
    }
    // stun stars
    if(this.stunned>0&&this.stunned%10<5){
      ctx.font='11px serif';ctx.textAlign='center';
      ctx.fillText('💫',2,-this.h/2-18);ctx.textAlign='left';
    }
    ctx.restore();
    ctx.font='8px "Share Tech Mono"';ctx.textAlign='center';
    ctx.fillStyle=el.col;ctx.shadowBlur=4;ctx.shadowColor=el.glow;
    ctx.fillText('P'+(this.idx+1),this.cx,this.y-7);ctx.shadowBlur=0;ctx.textAlign='left';
  }
}

// ══════════════════════════════════
// SUPER ATTACK CLASS
// ══════════════════════════════════
class SuperAtk{
  constructor(owner){
    this.owner=owner;this.elemId=owner.elemId;this.life=220;this.done=false;
    this.hitSet=new Set();this.data={};
    this.launch();
  }
  launch(){
    const o=this.owner,el=o.el;
    switch(this.elemId){
      case 'fire': // 12 fireballs in circle
        for(let i=0;i<12;i++){
          const a=(i/12)*Math.PI*2,spd=7+Math.random()*3;
          bullets.push(new Bullet(o,o.cx,o.cy,Math.cos(a)*spd,Math.sin(a)*spd,
            {dmg:30,r:18,col:'#ff6600',glow:'#ffaa00',effect:'burn',life:160}));
        }
        emit(o.cx,o.cy,40,{col:['#ff4400','#ff8800','#ffcc00'],spd:9,glow:true,up:2});
        this.done=true;break;

      case 'water': // wall sweeping across arena
        this.data={x:o.facing>0?o.cx:o.cx+50,dir:o.facing,w:70,h:240};
        this.data.y=PLATS[0].y-this.data.h;
        this.life=150;break;

      case 'lightning': // strike all enemies (never teammates)
        players.forEach(p=>{
          if(p===o||p.dead)return;
          if(setup&&setup.teamMode&&Array.isArray(setup.teams)&&setup.teams[p.idx]!==undefined&&setup.teams[o.idx]!==undefined&&setup.teams[p.idx]===setup.teams[o.idx])return;
          for(let i=0;i<5;i++)setTimeout(()=>{
            emit(p.cx,p.y-70,18,{col:['#ffff00','#ffffff'],spd:5,ang:Math.PI/2,glow:true,up:-2,grav:.1});
          },i*60);
          p.applyHit(24,o,'chain');
        });
        emit(o.cx,o.cy-20,30,{col:['#ffff00','#fff','#88ffff'],spd:8,glow:true});
        this.done=true;break;

      case 'earth': // 6 meteors rain down
        this.data.meteors=Array.from({length:6},(_,i)=>({x:rnd(80,W-80),y:-50-i*80,vy:1.5+i*.35,r:22,hit:false}));
        this.life=240;break;

      case 'wind': // cyclone that pulls everyone — spawns in upper arena
        this.data={x:o.cx,y:145,r:110,vx:o.facing*2.2};
        this.life=290;break;

      case 'shadow': // void pull then explosion
        this.data={phase:0,tick:0,cx:o.cx,cy:PLATS[0].y-130};
        this.life=220;break;
    }
  }
  update(){
    if(this.done){this.life=0;return;}
    this.life--;
    const o=this.owner,d=this.data;
    switch(this.elemId){
      case 'water':
        d.x+=d.dir*9;
        players.forEach(p=>{
          if(p===o||p.dead||this.hitSet.has(p.idx))return;
          if(setup&&setup.teamMode&&Array.isArray(setup.teams)&&setup.teams[p.idx]!==undefined&&setup.teams[o.idx]!==undefined&&setup.teams[p.idx]===setup.teams[o.idx])return;
          const wx=d.dir>0?d.x-d.w/2:d.x-d.w/2;
          if(p.right>d.x-d.w/2&&p.x<d.x+d.w/2&&p.bottom>d.y){
            this.hitSet.add(p.idx);
            p.applyHit(24,o,'knockback');p.vx+=d.dir*16;p.vy-=4;
            emit(p.cx,p.cy,16,{col:['#22aaff','#aaddff','#fff'],spd:6,glow:true});
          }
        });
        if(gf%3===0)emit(d.x+rnd(-d.w/2,d.w/2),d.y+rnd(0,d.h),3,{col:['#0088ff','#44aaff','#aaddff'],spd:2.5,grav:.04});
        if(d.x<-100||d.x>W+100)this.life=0;
        break;

      case 'earth':
        d.meteors.forEach(m=>{
          if(m.hit)return;
          m.vy+=.2;m.y+=m.vy;
          if(gf%2===0)emit(m.x,m.y,2,{col:['#886622','#aa9944','#664422'],spd:1.5,grav:.07});
          if(m.y>=PLATS[0].y-m.r){
            m.hit=true;
            emit(m.x,PLATS[0].y,28,{col:['#886622','#aa9944','#ffcc00'],spd:8,up:4,grav:.14});
            players.forEach(p=>{
              if(p===o||p.dead)return;
              if(setup&&setup.teamMode&&Array.isArray(setup.teams)&&setup.teams[p.idx]!==undefined&&setup.teams[o.idx]!==undefined&&setup.teams[p.idx]===setup.teams[o.idx])return;
              if(Math.abs(p.cx-m.x)<55){p.applyHit(18,o,'stun');emit(p.cx,p.cy,12,{col:['#886622','#ffcc00'],spd:5,glow:true});}
            });
          }
        });
        if(d.meteors.every(m=>m.hit))this.life=0;
        break;

      case 'wind':
        d.x+=d.vx;
        if(d.x<d.r||d.x>W-d.r)d.vx*=-1;
        players.forEach(p=>{
          if(p===o||p.dead)return;
          if(setup&&setup.teamMode&&Array.isArray(setup.teams)&&setup.teams[p.idx]!==undefined&&setup.teams[o.idx]!==undefined&&setup.teams[p.idx]===setup.teams[o.idx])return;
          const dx=d.x-p.cx,dy=d.y-p.cy,dist=Math.hypot(dx,dy);
          if(dist<d.r*3){
            const pull=(1-dist/(d.r*3))*1.4;
            p.vx+=dx/dist*pull;p.vy+=dy/dist*pull;
            if(dist<d.r&&gf%14===0)p.applyHit(6,o,'push');
          }
        });
        if(gf%2===0){
          const a=gf*.2;
          emit(d.x+Math.cos(a)*d.r*.85,d.y+Math.sin(a)*d.r*.45,2,{col:['#aaeeff','#fff'],spd:1,grav:-.02,glow:true});
        }
        break;

      case 'shadow':
        d.tick++;
        if(d.phase===0){
          // suck everything toward center
          players.forEach(p=>{
            if(p===o||p.dead)return;
            if(setup&&setup.teamMode&&Array.isArray(setup.teams)&&setup.teams[p.idx]!==undefined&&setup.teams[o.idx]!==undefined&&setup.teams[p.idx]===setup.teams[o.idx])return;
            const dx=d.cx-p.cx,dy=d.cy-p.cy,dist=Math.hypot(dx,dy)||1;
            const pull=Math.max(0,(260-d.tick)/260)*1.4;
            p.vx+=dx/dist*pull;p.vy+=dy/dist*pull;
          });
          if(gf%4===0)emit(d.cx+rnd(-100,100),d.cy+rnd(-80,80),3,{col:['#8800cc','#cc44ff','#440066'],spd:2.5,ang:Math.atan2(d.cy,d.cx)+Math.PI,grav:0,glow:true});
          if(d.tick>=130){
            d.phase=1;
            emit(d.cx,d.cy,50,{col:['#8800cc','#cc44ff','#ffffff','#ff88ff'],spd:14,glow:true});
            players.forEach(p=>{
              if(p===o||p.dead)return;
              if(setup&&setup.teamMode&&Array.isArray(setup.teams)&&setup.teams[p.idx]!==undefined&&setup.teams[o.idx]!==undefined&&setup.teams[p.idx]===setup.teams[o.idx])return;
              if(Math.hypot(p.cx-d.cx,p.cy-d.cy)<180){
                p.applyHit(26,o,'lifesteal');p.vx+=(p.cx-d.cx)/Math.max(1,Math.hypot(p.cx-d.cx,p.cy-d.cy))*18;p.vy-=8;
              }
            });
            this.life=30;
          }
        }
        break;
    }
  }

  draw(){
    if(this.done)return;
    const d=this.data;
    switch(this.elemId){
      case 'water':{
        const prog=Math.min(1,this.life/150);
        const wg=ctx.createLinearGradient(d.x-d.w/2,0,d.x+d.w/2,0);
        wg.addColorStop(0,'rgba(0,80,200,0)');wg.addColorStop(.35,'rgba(0,136,255,.65)');
        wg.addColorStop(.65,'rgba(68,180,255,.65)');wg.addColorStop(1,'rgba(0,80,200,0)');
        ctx.fillStyle=wg;ctx.globalAlpha=prog;ctx.shadowBlur=28;ctx.shadowColor='#0088ff';
        ctx.fillRect(d.x-d.w/2,d.y,d.w,d.h);ctx.shadowBlur=0;ctx.globalAlpha=1;break;}
      case 'earth':
        d.meteors.forEach(m=>{
          if(m.hit)return;
          ctx.save();ctx.shadowBlur=18;ctx.shadowColor='#aa9944';
          ctx.fillStyle='#553311';ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,Math.PI*2);ctx.fill();
          ctx.fillStyle='#aa9944';ctx.beginPath();ctx.arc(m.x-m.r*.35,m.y-m.r*.3,m.r*.5,0,Math.PI*2);ctx.fill();
          ctx.shadowBlur=0;ctx.restore();
        });break;
      case 'wind':{
        const p=.5+.3*Math.sin(gf*.16);
        for(let i=4;i>0;i--){
          ctx.shadowBlur=10;ctx.shadowColor='#aaeeff';
          ctx.strokeStyle=`rgba(170,238,255,${p*(i/4.5)})`;ctx.lineWidth=3;
          ctx.beginPath();ctx.ellipse(d.x,d.y,d.r*i/4,d.r*i/4*.55,gf*.05,0,Math.PI*2);ctx.stroke();
          ctx.shadowBlur=0;
        }break;}
      case 'shadow':{
        const prog=Math.min(d.tick/130,1);
        const sg=ctx.createRadialGradient(d.cx,d.cy,0,d.cx,d.cy,180);
        sg.addColorStop(0,`rgba(136,0,204,${.7*prog})`);
        sg.addColorStop(.5,`rgba(70,0,110,${.4*prog})`);
        sg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
        ctx.shadowBlur=22;ctx.shadowColor='#cc44ff';
        ctx.strokeStyle=`rgba(200,80,255,${.9*prog})`;ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(d.cx,d.cy,20+prog*60,0,Math.PI*2);ctx.stroke();
        ctx.shadowBlur=0;break;}
    }
  }
}

// GAME LOGIC
// ══════════════════════════════════
function initGame(){
  players=[];bullets=[];supers=[];parts=[];
  gamePaused=false;pauseKeyLatch=false;_setBgmPaused(false);
  if(tourney){
    // Track round history used by victory/defeat summary screens.
    if(!Array.isArray(tourney.usedPlayerElems))tourney.usedPlayerElems=[];
    if(!Array.isArray(tourney.usedCPUElems))tourney.usedCPUElems=[];
    if(tourney.usedPlayerElems.length<tourney.round)tourney.usedPlayerElems.push(tourney.playerElem);
    if(tourney.usedCPUElems.length<tourney.round)tourney.usedCPUElems.push(tourney.cpuElem);
    // Tournament: P0=human, P1=CPU
    setup.numP=2;setup.elems=[tourney.playerElem,tourney.cpuElem];setup.bindDevices=['keyboard','keyboard'];
    setup.binds=[tourney.playerBinds,{}];
    const p0=new Player(0,tourney.playerElem,tourney.playerBinds);
    const p1=new Player(1,tourney.cpuElem,{});
    p1.isCPU=true;p1.facing=-1;
    players=[p0,p1];
  }else{
    for(let i=0;i<setup.numP;i++)players.push(new Player(i,setup.elems[i],setup.binds[i]));
  }
}
function updateGame(){
  players.forEach(p=>p.update());
  bullets.forEach(b=>b.update());
  // bullet-player collision
  bullets.forEach(bl=>{
    if(bl.dead)return;
    players.forEach(p=>{
      if(p.idx===bl.ownIdx||p.dead||p.iframes>0)return;
      // No friendly fire in team mode
      if(setup.teamMode&&setup.teams[p.idx]===setup.teams[bl.ownIdx])return;
      if(bl.x+bl.r>p.x&&bl.x-bl.r<p.right&&bl.y+bl.r>p.y&&bl.y-bl.r<p.bottom){
        p.applyHit(bl.dmg,players[bl.ownIdx]||{el:ELEMS[bl.elemId],elemId:bl.elemId,cx:bl.x,cy:bl.y},bl.effect);
        bl.life=0;emit(bl.x,bl.y,10,{col:[bl.col,'#fff'],spd:5,glow:true});
      }
    });
  });
  bullets=bullets.filter(b=>!b.dead);
  supers.forEach(s=>s.update());supers=supers.filter(s=>s.life>0);
  tickParts();
  // win check
  const alive=players.filter(p=>!p.elim);
  let teamWin=null;
  if(setup.teamMode){
    const teamsAlive=[...new Set(alive.map(p=>setup.teams[p.idx]))];
    if(teamsAlive.length===1) teamWin=teamsAlive[0];
    else if(teamsAlive.length===0) teamWin=-1; // draw
  }
  if((setup.teamMode?(teamWin!==null):alive.length<=1)&&setup.numP>1){
    gamePaused=false;pauseKeyLatch=false;_setBgmPaused(false);
    if(tourney){
      const humanWon=alive.length===1&&alive[0].idx===0;
      tourney.lastResult=humanWon?'win':'lose';
      if(humanWon){
        tourney.wins++;
        if(tourney.round>=5){screen='tourneyVictory';}
        else{
          // Pre-pick next round elements so comic can show the upcoming opponent
          const oldRound=tourney.round;
          tourney.round++;
          tourney.difficulty=tourney.round;
          pickTourneyElems(); // pick fresh elems for next round
          comicF=0;screen='comic';
        }
      }else{screen='tourneyDefeat';}
    }else{setup.teamWin=setup.teamMode?teamWin:null;screen='results';}
  }
}

function drawBGSpace(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#040812');bg.addColorStop(1,'#08101e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,0,0,.15)';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,2);
  ctx.strokeStyle='rgba(70,110,200,.04)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let i=0;i<60;i++){
    const b=.2+.8*Math.sin(titleF*.016+i*1.3);
    ctx.globalAlpha=b*.4;ctx.fillStyle='#fff';
    ctx.fillRect((i*179)%W,(i*93)%(H-80),(b>.7?2:1),(b>.7?2:1));
  }ctx.globalAlpha=1;
}
function drawPlats(){
  PLATS.forEach(pl=>{
    const ug=ctx.createLinearGradient(pl.x,pl.y,pl.x,pl.y+55);
    ug.addColorStop(0,'rgba(70,130,255,.08)');ug.addColorStop(1,'transparent');
    ctx.fillStyle=ug;ctx.fillRect(pl.x-4,pl.y,pl.w+8,55);
    if(pl.main){
      const pg=ctx.createLinearGradient(pl.x,pl.y,pl.x,pl.y+pl.h);
      pg.addColorStop(0,'#182438');pg.addColorStop(.4,'#111c2e');pg.addColorStop(1,'#080e1a');
      ctx.fillStyle=pg;ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
      ctx.shadowBlur=12;ctx.shadowColor='#3366cc';
      ctx.fillStyle='#2255bb';ctx.fillRect(pl.x,pl.y,pl.w,3);ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(55,95,170,.09)';ctx.lineWidth=1;
      for(let gx=0;gx<pl.w;gx+=50){ctx.beginPath();ctx.moveTo(pl.x+gx,pl.y);ctx.lineTo(pl.x+gx,pl.y+pl.h);ctx.stroke();}
    } else {
      ctx.fillStyle='#121e30';ctx.fillRect(pl.x,pl.y,pl.w,pl.h+6);
      ctx.shadowBlur=8;ctx.shadowColor='#3366cc';
      ctx.fillStyle='#1e4499';ctx.fillRect(pl.x,pl.y,pl.w,3);ctx.shadowBlur=0;
      ctx.fillStyle='#162a55';ctx.shadowBlur=3;ctx.shadowColor='#2255aa';
      for(let dx=14;dx<pl.w-10;dx+=22)ctx.fillRect(pl.x+dx,pl.y+4,5,3);
      ctx.shadowBlur=0;
    }
  });
}
function drawHUD(){
  const n=setup.numP;
  const pw=Math.min(162,(W-16)/n-5);
  const sx=(W-(pw*n+(n-1)*5))/2;
  players.forEach((p,i)=>{
    const px=sx+i*(pw+5),py=7;
    ctx.fillStyle='rgba(4,6,16,.88)';ctx.fillRect(px,py,pw,72);
    ctx.strokeStyle=p.elim?'#1a1a22':p.el.col;ctx.lineWidth=1.8;
    ctx.shadowBlur=p.elim?0:8;ctx.shadowColor=p.el.glow;
    ctx.strokeRect(px,py,pw,72);ctx.shadowBlur=0;

    ctx.font=`bold ${pw>138?9:7}px "Orbitron"`;
    ctx.fillStyle=p.elim?'#333':p.el.col;
    ctx.shadowBlur=p.elim?0:4;ctx.shadowColor=p.el.glow;
    ctx.fillText(`P${i+1} ${p.el.name} ${p.el.emoji}`,px+5,py+17);ctx.shadowBlur=0;

    ctx.fillStyle='#0e0e18';ctx.fillRect(px+5,py+21,pw-10,10);
    if(!p.elim){
      const hr=Math.max(0,p.hp/p.maxHp);
      const hc=hr>.5?p.el.col:hr>.25?'#ffcc00':'#ff3300';
      ctx.shadowBlur=5;ctx.shadowColor=hc;ctx.fillStyle=hc;
      ctx.fillRect(px+5,py+21,(pw-10)*hr,10);ctx.shadowBlur=0;
      ctx.font='8px "Share Tech Mono"';ctx.fillStyle='#ccc';
      ctx.fillText(`${Math.max(0,Math.ceil(p.hp))} HP`,px+5,py+42);
      if(p.chargeTick>0){
        const cr=Math.min(p.chargeTick/180,1);
        ctx.fillStyle='#0a0a16';ctx.fillRect(px+5,py+46,pw-10,6);
        const bc=cr>=1?(Math.sin(gf*.28)>0?'#fff':p.el.glow):p.el.col;
        ctx.shadowBlur=5;ctx.shadowColor=bc;ctx.fillStyle=bc;
        ctx.fillRect(px+5,py+46,(pw-10)*cr,6);ctx.shadowBlur=0;
        ctx.font='7px "Share Tech Mono"';
        ctx.fillStyle=cr>=1?'#ffff44':'rgba(255,255,255,.5)';
        ctx.fillText(cr>=1?'★ SUPER READY!':'charging...',px+5,py+62);
      }
    }
    // lives
    for(let s=0;s<3;s++){
      const al=!p.elim&&s<p.lives;
      ctx.shadowBlur=al?5:0;ctx.shadowColor=p.el.glow;
      ctx.fillStyle=al?p.el.col:'#1a1a22';
      ctx.beginPath();ctx.arc(px+pw-42+s*14,py+62,al?5:3.5,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      if(!al){ctx.strokeStyle='#222';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(px+pw-42+s*14,py+62,3.5,0,Math.PI*2);ctx.stroke();}
    }
    if(p.elim){
      ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(px,py,pw,72);
      ctx.font='bold 11px "Orbitron"';ctx.textAlign='center';ctx.fillStyle='#444';
      ctx.fillText('ELIMINATED',px+pw/2,py+40);ctx.textAlign='left';
    }
  });
  // Tournament HUD overlay
  if(tourney){
    const pEl=ELEMS[tourney.playerElem],cEl=ELEMS[tourney.cpuElem];
    ctx.fillStyle='rgba(4,6,16,.88)';ctx.fillRect(W/2-160,7,320,26);
    ctx.strokeStyle='#886600';ctx.lineWidth=1.5;ctx.shadowBlur=8;ctx.shadowColor='#ffcc00';
    ctx.strokeRect(W/2-160,7,320,26);ctx.shadowBlur=0;
    ctx.textAlign='center';
    ctx.font='bold 9px "Orbitron"';ctx.fillStyle='#ffcc00';
    ctx.fillText(`TOURNAMENT  ·  ROUND ${tourney.round}/5  ·  ${'★'.repeat(tourney.difficulty)} DIFFICULTY`,W/2,23);
    ctx.textAlign='left';
  }
  // controls reminder
  if(gf<400){
    const al=Math.min(1,(400-gf)/80)*.4;
    ctx.globalAlpha=al;ctx.font='8px "Share Tech Mono"';
    players.forEach((p,i)=>{
      const b=p.binds;
      const f=k=>k.replace('Key','').replace('Arrow','').replace('Digit','').replace('Numpad','N');
      ctx.fillStyle=p.el.col;
      ctx.fillText(`P${i+1} ←${f(b.left)} →${f(b.right)} ↑${f(b.jump)} ⚡${f(b.attack)}`,4,H-22-i*13);
    });
    ctx.globalAlpha=1;
  }
}

function _togglePause(){
  if(screen!=='game')return;
  gamePaused=!gamePaused;
  _setBgmPaused(gamePaused);
  sfx('select');
}

function handlePauseControl(){
  if(screen!=='game'){pauseKeyLatch=false;return;}
  const esc=!!keys['Escape'];
  if(esc&&!pauseKeyLatch)_togglePause();
  pauseKeyLatch=esc;
}

function drawPausedOverlay(){
  if(!gamePaused||screen!=='game')return;
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='900 54px "Orbitron"';
  ctx.fillStyle='#ffdd66';
  ctx.shadowBlur=24;ctx.shadowColor='#ffcc00';
  ctx.fillText('PAUSED',W/2,H/2-8);
  ctx.shadowBlur=0;
  ctx.font='11px "Share Tech Mono"';
  ctx.fillStyle='rgba(235,245,255,.9)';
  ctx.fillText('PRESS ESC TO RESUME',W/2,H/2+22);
  ctx.textAlign='left';
}

  drawBGSpace();
  // rotating color rays
  EKEYS.forEach((k,i)=>{
    const el=ELEMS[k],a=titleF*.006+i*(Math.PI*2/6);

  ctx.textAlign='center';

  const tg=ctx.createLinearGradient(W/2-280,0,W/2+280,0);

  ctx.font='900 50px "Orbitron"';ctx.fillStyle='rgba(200,220,255,.92)';
  ctx.shadowBlur=16;ctx.shadowColor='rgba(100,140,255,.65)';
  ctx.fillText('C L A S H',W/2,H/2-6);ctx.shadowBlur=0;
  ctx.font='10px "Share Tech Mono"';ctx.fillStyle='rgba(140,170,255,.55)';
  ctx.fillText('2–6 PLAYERS  •  6 ELEMENTS  •  TEAM BATTLE  •  CHARGED SUPER ATTACKS',W/2,H/2+28);

// KEY BINDING
const BACTS=['left','right','jump','attack'];
const BLABELS=['LEFT ←','RIGHT →','JUMP  ↑','ATTACK ⚡'];
const BHINTS=['Move left','Move right','Jump (press twice for double jump)','Shoot! Hold 3 seconds = SUPER ATTACK!'];
const GP_NAMES=['A','B','X','Y','LB','RB','LT','RT','BACK','START','LS','RS','DPAD UP','DPAD DOWN','DPAD LEFT','DPAD RIGHT'];

function armBind(){
  if(setup.curP>=setup.numP){screen='game';initGame();return;}
  rawCap=null;rawGamepadCap=null;
  const cp=setup.curP,b=setup.binds[cp],act=BACTS[setup.bindSlot],device=setup.bindDevices[cp]||'keyboard';
  if(device==='controller'){
    rawGamepadCap=({pad,button})=>{
      rawGamepadCap=null;
      const code=_gpCode(button);
      if(Object.values(b).includes(code)){
        setup.bindErr='Button already used! Try another.';setup.bindErrT=110;
        setTimeout(armBind,16);return;
      }
      b[act]=code;setup.bindErr='';sfx('select');
      setup.bindSlot++;
      if(setup.bindSlot>=BACTS.length){setup.bindSlot=0;setup.curP++;}
      setTimeout(armBind,16);
    };
  } else {
    rawCap=code=>{
      rawCap=null;
      if(Object.values(b).includes(code)){
        setup.bindErr='Key already used! Try another.';setup.bindErrT=110;
        setTimeout(armBind,16);return;
      }
      b[act]=code;setup.bindErr='';sfx('select');
      setup.bindSlot++;
      if(setup.bindSlot>=BACTS.length){setup.bindSlot=0;setup.curP++;}
      setTimeout(armBind,16);
    };
  }
}

// Helper: draw a comic-style character icon
function drawElemChar(el,x,y,scale,flip){
  ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.scale(scale,scale);
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,38,24,6,0,0,Math.PI*2);ctx.fill();
  // Legs
  ctx.fillStyle=el.dark;ctx.fillRect(-14,18,11,22);ctx.fillRect(3,18,11,22);
  // Body glow
  ctx.shadowBlur=22;ctx.shadowColor=el.glow;
  const bg=ctx.createLinearGradient(-18,-10,18,20);
  bg.addColorStop(0,el.col);bg.addColorStop(1,el.dark);
  ctx.fillStyle=bg;ctx.fillRect(-18,-10,36,28);
  ctx.shadowBlur=0;
  // Arm reaching forward
  ctx.fillStyle=el.col;ctx.fillRect(18,-4,14,10);
  // Head
  ctx.shadowBlur=14;ctx.shadowColor=el.glow;
  ctx.fillStyle=el.col;ctx.fillRect(-14,-32,28,22);ctx.shadowBlur=0;
  // Visor
  ctx.fillStyle=el.glow;ctx.globalAlpha=.9;ctx.fillRect(-10,-29,20,8);ctx.globalAlpha=1;
  // Core
  ctx.shadowBlur=12;ctx.shadowColor=el.glow;
  ctx.fillStyle=el.glow;ctx.beginPath();ctx.arc(0,4,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,4,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  // Emoji badge
  ctx.font='22px serif';ctx.textAlign='center';ctx.fillText(el.emoji,0,-48);
  ctx.restore();
}

// Helper: speech bubble
function drawBubble(x,y,w,h,tailLeft,lines,col='#fff',bgCol='rgba(8,12,28,.95)'){
  ctx.save();
  ctx.shadowBlur=18;ctx.shadowColor=col;
  ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.fillStyle=bgCol;
  ctx.beginPath();
  const r=12;
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  // tail
  if(tailLeft){
    ctx.lineTo(x+40,y+h);ctx.lineTo(x+22,y+h+24);ctx.lineTo(x+16,y+h);
  } else {
    ctx.lineTo(x+w-16,y+h);ctx.lineTo(x+w-22,y+h+24);ctx.lineTo(x+w-40,y+h);
  }
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;
  ctx.textAlign='center';
  lines.forEach((ln,i)=>{
    ctx.font=ln.bold?`bold ${ln.sz||11}px "Orbitron"`:`${ln.sz||10}px "Share Tech Mono"`;
    ctx.fillStyle=ln.col||'rgba(200,220,255,.9)';
    ctx.fillText(ln.t,x+w/2,y+24+i*18);
  });
  ctx.textAlign='left';ctx.restore();
}

function pickTourneyElems(){

  tourney.cpuElem=tourney.cpuOrder[tourney.round-1];

function armTourneyBind(){
  rawCap=code=>{
    rawCap=null;
    const b=setup.binds[0],act=BACTS[setup.bindSlot];
    if(Object.values(b).includes(code)){
      setup.bindErr='Already used! Try another.';setup.bindErrT=110;
      setTimeout(armTourneyBind,16);return;
    }
    b[act]=code;setup.bindErr='';sfx('select');
    setup.bindSlot++;
    if(setup.bindSlot>=BACTS.length){
      tourney.playerBinds=setup.binds[0];
      screen='tourneyReveal';titleF=0;
    } else setTimeout(armTourneyBind,16);
  };
}

// ONLINE MULTIPLAYER (WEBRTC / PEERJS)
// ══════════════════════════════════
const NET_PREFIX = "elclash-";
let netState = {
  isOnline: false,
  isHost: false,
  peer: null,
  peerId: null,
  roomCode: "",
  inputRoomCode: "",
  conn: null,
  peers: [],
  myPlayerIdx: 0,
  myElemId: "fire",
  statusMsg: "",
  errorMsg: "",
  connected: false
};

function initPeer(customId, onOpen) {
  if (netState.peer && !netState.peer.destroyed) {
    if (onOpen) onOpen(netState.peer.id);
    return;
  }
  try {
    netState.statusMsg = "Connecting to matchmaking...";
    const PeerClass = window.Peer || (typeof Peer !== "undefined" ? Peer : null);
    if (!PeerClass) {
      netState.errorMsg = "PeerJS library loading... please wait.";
      return;
    }
    netState.peer = customId ? new PeerClass(customId) : new PeerClass();

    netState.peer.on("open", id => {
      netState.peerId = id;
      netState.statusMsg = "Connected to network!";
      netState.errorMsg = "";
      if (onOpen) onOpen(id);
    });

    netState.peer.on("error", err => {
      console.error("Peer error:", err);
      if (err.type === "unavailable-id") {
        netState.errorMsg = "Room code already in use! Generating new code...";
        setTimeout(startHosting, 800);
      } else {
        netState.errorMsg = "Network error: " + (err.message || err.type);
      }
    });

    netState.peer.on("connection", conn => {
      if (!netState.isHost) {
        conn.close();
        return;
      }
      setupHostConnection(conn);
    });
  } catch (e) {
    netState.errorMsg = "Error initializing Peer: " + e.message;
  }
}

function startHosting() {
  const code = Math.random().toString(36).substring(2, 6).toUpperCase();
  netState.roomCode = code;
  netState.isHost = true;
  netState.isOnline = true;
  netState.myPlayerIdx = 0;
  netState.peers = [];
  netState.statusMsg = "Creating room " + code + "...";
  netState.errorMsg = "";

  initPeer(NET_PREFIX + code, id => {
    netState.statusMsg = "Room ready! Share code: " + code;
  });
}

function setupHostConnection(conn) {
  conn.on("open", () => {
    if (netState.peers.length >= 5) {
      conn.send({ type: "error", msg: "Room is full (max 6 players)!" });
      conn.close();
      return;
    }
    const playerIdx = netState.peers.length + 1;
    const clientEntry = {
      peerId: conn.peer,
      conn: conn,
      playerIdx: playerIdx,
      elemId: EKEYS[playerIdx % EKEYS.length],
      ready: true
    };
    netState.peers.push(clientEntry);
    netState.statusMsg = "Player " + (playerIdx + 1) + " joined!";

    conn.send({
      type: "welcome",
      playerIdx: playerIdx,
      roomCode: netState.roomCode,
      hostElem: netState.myElemId,
      players: getLobbyPlayerList()
    });
    broadcastLobbyState();
  });

  conn.on("data", data => {
    handleHostData(conn, data);
  });

  conn.on("close", () => {
    netState.peers = netState.peers.filter(p => p.conn !== conn);
    netState.statusMsg = "A player left the room.";
    broadcastLobbyState();
  });
}

function getLobbyPlayerList() {
  const list = [{ idx: 0, elemId: netState.myElemId, isHost: true }];
  netState.peers.forEach(p => {
    list.push({ idx: p.playerIdx, elemId: p.elemId, isHost: false });
  });
  return list;
}

function broadcastLobbyState() {
  const pList = getLobbyPlayerList();
  netState.peers.forEach(p => {
    if (p.conn && p.conn.open) {
      p.conn.send({ type: "lobbyUpdate", players: pList });
    }
  });
}

function handleHostData(conn, data) {
  if (!data || !data.type) return;
  const client = netState.peers.find(p => p.conn === conn);
  if (!client) return;

  if (data.type === "elemSelect") {
    client.elemId = data.elemId;
    broadcastLobbyState();
  } else if (data.type === "input") {
    if (screen === "game" && players[client.playerIdx]) {
      const p = players[client.playerIdx];
      p.remoteInput = data.input || {};
    }
  }
}

function joinRoom(code) {
  code = (code || "").trim().toUpperCase();
  if (code.length < 3) {
    netState.errorMsg = "Please enter a 4-letter room code!";
    return;
  }
  netState.isHost = false;
  netState.isOnline = true;
  netState.roomCode = code;
  netState.statusMsg = "Connecting to room " + code + "...";
  netState.errorMsg = "";

  initPeer(null, () => {
    const hostPeerId = NET_PREFIX + code;
    const conn = netState.peer.connect(hostPeerId, { reliable: true });
    netState.conn = conn;

    conn.on("open", () => {
      netState.statusMsg = "Connected to room! Waiting for host...";
      netState.connected = true;
    });

    conn.on("data", data => {
      handleClientData(data);
    });

    conn.on("close", () => {
      netState.statusMsg = "Disconnected from host.";
      netState.connected = false;
    });

    conn.on("error", err => {
      netState.errorMsg = "Connection error: " + err;
    });
  });
}

function handleClientData(data) {
  if (!data || !data.type) return;

  if (data.type === "welcome") {
    netState.myPlayerIdx = data.playerIdx;
    netState.roomCode = data.roomCode;
    netState.statusMsg = "Joined room as Player " + (data.playerIdx + 1) + "!";
    if (data.players) {
      netState.peers = data.players;
    }
  } else if (data.type === "lobbyUpdate") {
    netState.peers = data.players || [];
  } else if (data.type === "gameStart") {
    setup.numP = data.numP;
    setup.elems = data.elems;
    setup.bindDevices = Array.from({ length: setup.numP }, () => "keyboard");
    setup.binds = [
      { left: "ArrowLeft", right: "ArrowRight", jump: "ArrowUp", attack: "Space" },
      { left: "ArrowLeft", right: "ArrowRight", jump: "ArrowUp", attack: "Space" },
      { left: "ArrowLeft", right: "ArrowRight", jump: "ArrowUp", attack: "Space" },
      { left: "ArrowLeft", right: "ArrowRight", jump: "ArrowUp", attack: "Space" },
      { left: "ArrowLeft", right: "ArrowRight", jump: "ArrowUp", attack: "Space" },
      { left: "ArrowLeft", right: "ArrowRight", jump: "ArrowUp", attack: "Space" }
    ];
    screen = "game";
    initGame();
  } else if (data.type === "gameState") {
    if (screen === "game") {
      applyRemoteGameState(data);
    }
  }
}

function applyRemoteGameState(data) {
  if (!data.players) return;
  data.players.forEach(pd => {
    const p = players[pd.idx];
    if (p) {
      // Local client player position smoothing
      if (pd.idx === netState.myPlayerIdx) {
        if (Math.abs(p.x - pd.x) > 35) p.x = pd.x;
        if (Math.abs(p.y - pd.y) > 35) p.y = pd.y;
      } else {
        p.x = pd.x; p.y = pd.y;
      }
      p.vx = pd.vx; p.vy = pd.vy;
      p.hp = pd.hp; p.lives = pd.lives;
      p.dead = pd.dead; p.elim = pd.elim;
      p.facing = pd.facing;
      p.iframes = pd.iframes;
      p.superReady = pd.superReady;
      p.chargeTick = pd.chargeTick;
      if (p.elemId !== pd.elemId) {
        p.elemId = pd.elemId;
        p.el = ELEMS[pd.elemId];
      }
    }
  });

  if (data.bullets) {
    bullets = data.bullets.map(b => {
      const owner = players[b.ownIdx] || { idx: b.ownIdx, elemId: b.elemId, el: ELEMS[b.elemId] };
      const nb = new Bullet(owner, b.x, b.y, b.vx, b.vy, {
        dmg: b.dmg, r: b.r, col: b.col, glow: b.glow, effect: b.effect, life: b.life
      });
      return nb;
    });
  }
}

function hostBroadcastGameState() {
  if (!netState.isOnline || !netState.isHost || screen !== "game") return;
  const pData = players.map(p => ({
    idx: p.idx, x: Math.round(p.x), y: Math.round(p.y),
    vx: Math.round(p.vx * 10) / 10, vy: Math.round(p.vy * 10) / 10,
    hp: p.hp, lives: p.lives, dead: p.dead, elim: p.elim,
    facing: p.facing, iframes: p.iframes,
    superReady: p.superReady, chargeTick: p.chargeTick,
    elemId: p.elemId
  }));
  const bData = bullets.map(b => ({
    ownIdx: b.ownIdx, elemId: b.elemId, x: Math.round(b.x), y: Math.round(b.y),
    vx: Math.round(b.vx * 10) / 10, vy: Math.round(b.vy * 10) / 10,
    dmg: b.dmg, r: b.r, col: b.col, glow: b.glow, effect: b.effect, life: b.life
  }));

  const msg = { type: "gameState", players: pData, bullets: bData };
  netState.peers.forEach(p => {
    if (p.conn && p.conn.open) {
      p.conn.send(msg);
    }
  });
}

function clientSendInputs() {
  if (!netState.isOnline || netState.isHost || !netState.conn || !netState.conn.open) return;
  const stick = (setup.bindDevices && setup.bindDevices[netState.myPlayerIdx] === "controller") ? _controllerStick() : { x: 0, y: 0 };
  const b = setup.binds[netState.myPlayerIdx] || { left: "ArrowLeft", right: "ArrowRight", jump: "ArrowUp", attack: "Space" };
  const input = {
    left: _controlPressed(b.left) || (stick.x < -0.35) || !!keys["ArrowLeft"] || !!keys["KeyA"],
    right: _controlPressed(b.right) || (stick.x > 0.35) || !!keys["ArrowRight"] || !!keys["KeyD"],
    jump: _controlPressed(b.jump) || (stick.y < -0.35) || !!keys["ArrowUp"] || !!keys["KeyW"],
    attack: _controlPressed(b.attack) || !!keys["Space"] || !!keys["KeyF"]
  };
  netState.conn.send({ type: "input", input: input });
}

          const nextElem = EKEYS[nextIdx];
          if (netState.isHost) {
            netState.myElemId = nextElem;
            broadcastLobbyState();
          } else {
            if (netState.conn) netState.conn.send({ type: "elemSelect", elemId: nextElem });
          }
          sfx("select");
        }
      } else {
        ctx.font = '10px "Share Tech Mono"'; ctx.fillStyle = "rgba(150, 150, 150, 0.4)";
        ctx.fillText("WAITING...", sx + slotW / 2, sy + 58);
      }
    }

    // Host START BUTTON
    if (netState.isHost) {
      const sbw = 230, sbh = 46, sbx = rx + (rw - sbw) / 2, sby = ry + rh - 60;
      const canStart = allPlayers.length >= 2;
      const hovS = canStart && inbox(sbx, sby, sbw, sbh);
      ctx.fillStyle = canStart ? (hovS ? "#00ffcc" : "#00bb99") : "#2b3b3b";
      ctx.fillRect(sbx, sby, sbw, sbh);
      ctx.font = 'bold 14px "Orbitron"';
      ctx.fillStyle = canStart ? "#000" : "#667777";
      ctx.fillText(canStart ? "START GAME" : "NEED 2+ PLAYERS", sbx + sbw / 2, sby + 28);

      if (canStart && mclk && hovS) {
        sfx("select");
        const elems = allPlayers.map(p => p.elemId || "fire");
        setup.numP = allPlayers.length;
        setup.elems = elems;
        setup.bindDevices = Array.from({ length: setup.numP }, () => "keyboard");
        setup.binds = [
          { left: "ArrowLeft", right: "ArrowRight", jump: "ArrowUp", attack: "Space" },
          { left: "KeyA", right: "KeyD", jump: "KeyW", attack: "KeyF" },
          { left: "KeyJ", right: "KeyL", jump: "KeyI", attack: "KeyH" },
          { left: "Numpad4", right: "Numpad6", jump: "Numpad8", attack: "Numpad5" },
          { left: "KeyF", right: "KeyH", jump: "KeyT", attack: "KeyG" },
          { left: "KeyB", right: "KeyM", jump: "Space", attack: "KeyN" }
        ].slice(0, setup.numP);

        // Tell all clients to start
        netState.peers.forEach(p => {
          if (p.conn && p.conn.open) {
            p.conn.send({
              type: "gameStart",
              numP: setup.numP,
              elems: elems
            });
          }
        });
        screen = "game";
        initGame();
      }
    } else {
      ctx.font = '12px "Share Tech Mono"'; ctx.fillStyle = "#ffdd44";
      ctx.fillText("Waiting for host to launch battle...", rx + rw / 2, ry + rh - 35);
    }
  }

  // Back Button
  const bbx = 35, bby = H - 55, bbw = 140, bbh = 38;
  const hovBB = inbox(bbx, bby, bbw, bbh);
  ctx.fillStyle = hovBB ? "rgba(255, 60, 60, 0.4)" : "rgba(20, 20, 30, 0.8)";
  ctx.fillRect(bbx, bby, bbw, bbh);
  ctx.strokeStyle = hovBB ? "#ff4466" : "#663344"; ctx.lineWidth = 1.5;
  ctx.strokeRect(bbx, bby, bbw, bbh);
  ctx.font = 'bold 11px "Orbitron"'; ctx.fillStyle = hovBB ? "#fff" : "#ff8899";
  ctx.fillText("← BACK", bbx + bbw / 2, bby + 24);
  if (mclk && hovBB) {
    if (netState.conn) netState.conn.close();
    if (netState.peer) netState.peer.destroy();
    netState.isOnline = false;
    netState.isHost = false;
    netState.peer = null;
    netState.conn = null;
    netState.roomCode = "";
    netState.peers = [];
    netState.statusMsg = "";
    netState.errorMsg = "";
    screen = "title";
    sfx("select");
  }

  ctx.textAlign = "left";
}

// ══════════════════════════════════
// MAIN LOOP
// ══════════════════════════════════
function loop(){
  requestAnimationFrame(loop);
  if(rawGamepadCap){
    const press=_scanGamepadPress();
    if(press)rawGamepadCap(press);
  }
  handlePauseControl();
  if(screen!=='game'&&gamePaused){gamePaused=false;_setBgmPaused(false);}
  if(!(screen==='game'&&gamePaused)){gf++;titleF++;}
  ctx.clearRect(0,0,W,H);
  switch(screen){
    case 'title': doTitle();break;
    case 'netLobby': doNetLobby();break;
    case 'count': doCount();break;
    case 'elem':  doElem();break;
    case 'bind':  doBind();break;
    case 'game':
      if(!gamePaused)updateGame();
      drawBGSpace();drawPlats();drawParts();
      supers.forEach(s=>s.draw());
      bullets.forEach(b=>b.draw());
      players.forEach(p=>p.draw());
      drawHUD();
      drawPausedOverlay();
      if(typeof netState !== 'undefined' && netState.isOnline){
        if(netState.isHost){
          if(gf%2===0) hostBroadcastGameState();
        } else {
          clientSendInputs();
        }
      }
      break;
    case 'results': doResults();break;
    case 'teamCount': doTeamCount();break;
    case 'teamAssign': doTeamAssign();break;
    case 'tourneyStart':   doTourneyStart();break;
    case 'tourneyBind':    doTourneyBind();break;
    case 'tourneyReveal':  doTourneyReveal();break;
    case 'comic':          doComic();break;
    case 'tourneyDefeat':  doTourneyDefeat();break;
    case 'tourneyVictory': doTourneyVictory();break;
  }
  mclk=false;
}
loop();
</script>
